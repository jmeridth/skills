---
name: "Release"
on:
  workflow_dispatch:
  # pull_request_target runs from the base branch and never checks out PR code
  pull_request_target:
    types: [closed]
    branches: [main]
    # Release only when the installable plugin changes; CI and docs merges never release
    paths:
      - "jmeridth-skills/**"
      - ".claude-plugin/marketplace.json"

permissions: {}

# Serialize releases so two merges cannot race on the same tag
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write # Create releases and push tags
      pull-requests: read # Read PR labels for release-drafter
    uses: github-community-projects/ospo-reusable-workflows/.github/workflows/release-minimal.yaml@a48c75fafbf2513929ff2ce06dfaa38247ddc50b # v2.1.0
    with:
      # Configuration file for release-drafter, relative to .github/
      release-config-name: release-drafter.yml
      publish: true
      # Only release when the 'release' label is on the merged PR. The
      # auto-labeler applies it to any PR that touches the plugin.
      release-only-with-label: true
      # plugin.json is the source of truth for the release version
      version-file: jmeridth-skills/.claude-plugin/plugin.json
      version-key: .version
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
