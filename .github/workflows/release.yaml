name: Release

on:
  workflow_dispatch:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  release:
    permissions:
      contents: write # Create releases and push tags
      pull-requests: read # Read PR labels for release-drafter
    uses: github-community-projects/ospo-reusable-workflows/.github/workflows/release-minimal.yaml@4bf2f3062f44f0f2461de7c937d7695cf51549a0 # v2.0.0
    with:
      # Configuration file for release-drafter, relative to .github/
      release-config-name: release-drafter.yml
      # Publish the release after the draft and tags are created.
      # When false, the release stays a draft for manual review.
      publish: true
      # Only release when the 'release' label is on the merged PR.
      # The breaking, feature, and vuln labels do not trigger a release on their own.
      release-only-with-label: true
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
